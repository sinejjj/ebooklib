<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>本地书库管理 · 电子图书馆</title>
<style>
:root{
  --bg:#f5f6f8; --panel:#ffffff; --line:#e3e6ea; --line2:#eef0f3;
  --txt:#1f2328; --txt2:#5b6470; --txt3:#8b949e;
  --accent:#2f6fd0; --accent-soft:#eaf1fc;
  --dup:#d93025; --dup-soft:#fdeceb;
  --keep:#1a7f45; --keep-soft:#e8f5ed;
  --warn:#b26a00; --warn-soft:#fdf3e3;
  --r9:#b8372b; --r8:#d97706; --r7:#1a7f45; --r6:#6b7280; --r0:#b8bfc7;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--txt);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}

header{
  position:sticky;top:0;z-index:50;background:var(--panel);
  border-bottom:1px solid var(--line);padding:10px 18px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
}
.logo{font-size:16px;font-weight:700;letter-spacing:.5px;white-space:nowrap}
.logo small{font-weight:400;color:var(--txt3);font-size:12px;margin-left:6px}
.search{flex:1;min-width:180px;max-width:420px;position:relative}
.search input{width:100%;padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:#fbfcfd;outline:none}
.search input:focus{border-color:var(--accent);background:#fff}
.spacer{flex:1}
.ctl{display:flex;align-items:center;gap:6px;white-space:nowrap}
.ctl label{color:var(--txt2);font-size:12px}
select,.btn{padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;outline:none}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#2860b8;color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}

.wrap{display:flex;align-items:flex-start;gap:0;max-width:1600px;margin:0 auto}
aside{width:236px;flex:0 0 236px;position:sticky;top:57px;height:calc(100vh - 57px);overflow-y:auto;background:var(--panel);border-right:1px solid var(--line);padding:14px 12px 40px}
aside h4{margin:16px 0 8px;font-size:11px;font-weight:700;color:var(--txt3);letter-spacing:1px;text-transform:uppercase}
aside h4:first-child{margin-top:0}
.cat{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:7px;cursor:pointer;user-select:none}
.cat:hover{background:#f2f4f7}
.cat.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.cat .cnt{margin-left:auto;font-size:11px;color:var(--txt3)}
.cat.on .cnt{color:var(--accent)}
.chk{display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:7px;cursor:pointer}
.chk:hover{background:#f2f4f7}
.chk input{accent-color:var(--accent)}
aside .mini{font-size:12px;color:var(--txt3);padding:4px 8px;line-height:1.5}

main{flex:1;min-width:0;padding:14px 18px 80px}
.statbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:9px 14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:12px;font-size:13px;color:var(--txt2)}
.statbar b{color:var(--txt);font-weight:600}
.statbar .sep{width:1px;height:14px;background:var(--line)}

.list{display:flex;flex-direction:column;gap:8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 13px;display:flex;gap:11px;align-items:flex-start}
.card:hover{border-color:#cdd4dc}
.card.sel{border-color:var(--accent);background:#fbfdff}
.card.dup{border-left:3px solid var(--dup)}
.card.gone{opacity:.55}
.pick{margin-top:3px;accent-color:var(--accent);width:15px;height:15px;flex:0 0 15px}
.rating{flex:0 0 58px;text-align:center;padding:5px 2px;border-radius:8px;font-weight:700;font-size:15px;line-height:1.12;font-variant-numeric:tabular-nums}
.rating .lbl{display:block;font-size:8.5px;font-weight:400;opacity:.55;margin-top:1px;letter-spacing:.2px}
.rating .vt{display:block;font-size:10px;font-weight:400;color:var(--txt2);opacity:.95;margin-top:2px;white-space:nowrap}
.body{flex:1;min-width:0}
.nm{font-size:15px;font-weight:600;line-height:1.45;word-break:break-word}
.nm .au{color:var(--accent)}
.chip{display:inline-block;font-size:11px;padding:1px 7px;border-radius:20px;background:#f0f2f5;color:var(--txt2);margin-right:5px;vertical-align:2px}
.chip.dup{background:var(--dup-soft);color:var(--dup);font-weight:600}
.chip.keep{background:var(--keep-soft);color:var(--keep)}
.chip.read{background:var(--accent-soft);color:var(--accent)}
.chip.scan{background:#f3eefe;color:#6b46c1}
.chip.vol{background:#eef2ff;color:#4f46e5;font-weight:600}
.chip.warn{background:var(--warn-soft);color:var(--warn);font-weight:600}
.chip.del{background:#eef0f3;color:#6b7280}
.oneline{color:var(--txt2);font-size:13px;margin-top:4px;word-break:break-word}
.meta{color:var(--txt3);font-size:12px;margin-top:5px;display:flex;gap:10px;flex-wrap:wrap}
.acts{display:flex;flex-direction:column;gap:5px;align-items:flex-end;flex:0 0 auto}
.mini-btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:3px 8px;font-size:11px;color:var(--txt2);white-space:nowrap}
.mini-btn:hover{border-color:var(--accent);color:var(--accent)}
.mini-btn.on{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}

.copies{margin-top:9px;border-top:1px dashed var(--line);padding-top:8px;display:none}
.copies.show{display:block}
.copy{display:flex;align-items:center;gap:9px;padding:4px 0;font-size:12px;color:var(--txt2)}
.copy .p{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--txt3);word-break:break-all;flex:1}
.copy .e{background:#f0f2f5;border-radius:4px;padding:0 5px;font-size:10px;color:var(--txt2)}

.tags{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.tag{font-size:11px;padding:2px 9px;border-radius:20px;border:1px solid var(--line);background:#fff;color:var(--txt3)}
.tag:hover{border-color:var(--accent);color:var(--accent)}
.tag.on{background:var(--warn-soft);border-color:var(--warn);color:var(--warn);font-weight:600}
.tag.on.k{background:var(--keep-soft);border-color:var(--keep);color:var(--keep)}
.chip.notes{background:var(--keep-soft);color:var(--keep)}
.chip.moved{background:var(--accent-soft);color:var(--accent);font-weight:600}

/* 待确认面板 */
.amb{border:1px solid var(--warn);background:var(--warn-soft);border-radius:8px;padding:8px;margin-top:8px;font-size:12px;max-height:340px;overflow:auto}
.amb .ambHead{display:flex;justify-content:space-between;align-items:center;font-weight:600;color:var(--warn);margin-bottom:6px}
.amb .ambItem{border-top:1px dashed #e3c98f;padding:6px 0}
.amb .ambItem .t{font-weight:600;color:var(--txt)}
.amb .ambItem .rs{font-weight:400;color:var(--warn);margin-left:6px;font-size:11px}
.amb .ambItem .o{color:var(--txt3);font-size:11px;word-break:break-all;margin-top:2px}
.amb .ambItem .o.sm{opacity:.8}
.amb .ambItem .cs{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.amb .mini-btn{background:#fff}

/* 我的标记行：5 星 + 阅读进度 */
.myrow{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:6px;min-height:20px}
.myrow.idle{opacity:.5}
.mine{display:flex;align-items:center;gap:6px}
.mine .lb{font-size:11px;color:var(--txt3)}
.stars{display:inline-flex;gap:2px;user-select:none;line-height:1}
.stars b{font-size:15px;font-weight:400;color:#d3d8de;cursor:pointer;padding:1px;transition:color .1s,transform .1s}
.stars b.on{color:#e0a300}
.stars b.half{background:linear-gradient(90deg,#e0a300 50%,#d3d8de 50%);-webkit-background-clip:text;background-clip:text;color:transparent}
.stars b:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:3px}
@media(hover:hover){.stars b:hover{transform:scale(1.18)}}
@media(hover:none){.stars b{padding:6px 3px;font-size:18px}}
.prog{display:flex;align-items:center;gap:7px;min-width:0}
.prog .pt{font:inherit;font-size:11px;color:var(--txt2);font-variant-numeric:tabular-nums;
  background:none;border:0;border-bottom:1px dashed var(--line);padding:0 0 1px;cursor:pointer}
.prog .pt:hover{color:var(--accent);border-bottom-color:var(--accent)}
.prog .pt.none{color:var(--txt3);border-bottom-color:transparent}
.prog .pt.over{color:var(--warn);border-bottom-color:var(--warn)}
.bar{display:block;width:96px;height:5px;border-radius:3px;background:var(--line2);overflow:hidden}
.bar>b{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .18s}
.bar>b.full{background:var(--keep)}
.bar.empty{background:none;border-top:1px dashed var(--line);height:0}
.meta .pub.none{opacity:.6}

/* 笔记抽屉 */
.scrim{position:fixed;inset:0;background:rgba(20,24,30,.26);z-index:79;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;z-index:80;width:min(440px,94vw);height:100vh;background:var(--panel);
  border-left:1px solid var(--line);box-shadow:-8px 0 28px rgba(0,0,0,.10);
  transform:translateX(102%);transition:transform .22s ease;display:flex;flex-direction:column}
.drawer.show{transform:none}
.dhead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.dhead b{font-size:14px;line-height:1.4;word-break:break-word}
.dbody{flex:1;overflow-y:auto;padding:4px 14px 30px}
.dbody section{padding:13px 0;border-bottom:1px solid var(--line2)}
.dbody section:last-child{border-bottom:0}
.dbody h5{margin:0 0 9px;font-size:11px;color:var(--txt3);letter-spacing:1px;font-weight:700}
.drow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.drow input[type=number]{width:88px}
.drow input[type=url]{flex:1;min-width:150px}
.dbody input[type=number],.dbody input[type=url],.dbody textarea{
  padding:6px 9px;border:1px solid var(--line);border-radius:7px;background:#fbfcfd;outline:none;font-size:13px}
.dbody input:focus,.dbody textarea:focus{border-color:var(--accent);background:#fff}
.dbody textarea{width:100%;min-height:170px;resize:vertical;font:13px/1.7 inherit}
.bar.big{width:100%;height:7px;margin:9px 0 6px}
.dhint{font-size:11px;color:var(--txt3);line-height:1.6;margin-top:6px}
.dhint b{color:var(--txt2)}

.empty{padding:50px 0;text-align:center;color:var(--txt3)}

footer{position:fixed;bottom:0;left:0;right:0;z-index:60;background:var(--panel);border-top:1px solid var(--line);padding:9px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:0 -2px 10px rgba(0,0,0,.04)}
footer .n{font-size:13px;color:var(--txt2)}
footer .n b{color:var(--accent);font-size:15px}
.hint{font-size:11px;color:var(--txt3)}
.toast{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);background:#1f2328;color:#fff;padding:8px 16px;border-radius:8px;font-size:13px;z-index:99;opacity:0;pointer-events:none;transition:opacity .18s}
.toast.show{opacity:1}
.syncbar{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--txt2)}
.syncbar .dot{width:8px;height:8px;border-radius:50%;background:#b8bfc7;display:inline-block}
.syncbar .dot.ok{background:var(--keep)}
.syncbar .dot.warn{background:var(--warn)}
.storebadge{font-size:11px;color:var(--txt3);cursor:pointer;padding:4px 8px;border:1px solid var(--line);border-radius:7px;white-space:nowrap;background:#fff}
.storebadge:hover{border-color:var(--accent);color:var(--accent)}
.storebadge.warn{background:#fff7e6;border-color:#ffd591;color:#a15c00}
.hmodal{position:fixed;left:50%;top:50%;transform:translate(-50%,-48%) scale(.98);z-index:90;
  width:min(560px,92vw);max-height:82vh;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;box-shadow:0 18px 60px rgba(20,24,30,.22);display:flex;flex-direction:column;
  opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}
.hmodal.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.hhead{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--line)}
.hhead b{font-size:14px}
.hbody{overflow-y:auto;padding:14px 18px 20px;font-size:13px;line-height:1.7;color:var(--txt2)}
.hbody h5{margin:16px 0 7px;font-size:11px;color:var(--txt3);letter-spacing:1px}
.hbody h5:first-child{margin-top:0}
.hbody code{background:#f4f5f7;padding:2px 6px;border-radius:5px;font-size:12px;word-break:break-all}
.hbody .kv{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 14px;margin:6px 0}
.hbody .kv span b{color:var(--accent);font-size:14px}
.hbody .note{background:#fff7e6;border:1px solid #ffe0a3;border-radius:8px;padding:10px 12px;color:#8a5a00;font-size:12px}
.hbody textarea{width:100%;min-height:76px;padding:8px;border:1px solid var(--line);border-radius:7px;font:12px/1.5 monospace;resize:vertical;background:#fbfcfd}
.hbody .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
/* 开屏引导：遮罩虚化主页面，小窗保持清晰 */
.scrim.welcome{background:rgba(20,24,30,.34);backdrop-filter:blur(6px) saturate(.9);-webkit-backdrop-filter:blur(6px) saturate(.9);z-index:95}
.wmodal{position:fixed;left:50%;top:50%;transform:translate(-50%,-48%) scale(.98);z-index:96;
  width:min(430px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:14px;
  box-shadow:0 20px 60px rgba(20,24,30,.28);opacity:0;pointer-events:none;
  transition:opacity .18s,transform .18s}
.wmodal.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.whead{padding:14px 18px;border-bottom:1px solid var(--line);font-size:15px}
.wbody{padding:16px 18px 18px}
.wlead{margin:0 0 16px;font-size:14px;line-height:1.9;color:var(--txt)}
.wbtns{display:flex;gap:10px;flex-wrap:wrap}
.wbtns .btn{padding:9px 14px}
.wpriv{margin-top:14px;font-size:11px;color:var(--txt3);line-height:1.7}
.wfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px}
.wskip{border:0;background:none;color:var(--txt3);font-size:11px;text-decoration:underline;cursor:pointer}
.wiframe{margin-top:12px;padding:10px;background:var(--warn-soft);border:1px solid #f0d9a8;
  border-radius:8px;font-size:12px;line-height:1.7;color:var(--warn)}
</style>
</head>
<body>

<header>
  <div class="logo">本地书库管理 <small id="hdSub"></small></div>
  <div class="search"><input id="q" placeholder="搜索书名 / 作者…" autocomplete="off"></div>
  <div class="ctl"><label>排序</label>
    <select id="sort">
      <option value="rating_desc">评分 高→低</option>
      <option value="rating_asc">评分 低→高</option>
      <option value="mine_desc">我的评分 高→低</option>
      <option value="mine_asc">我的评分 低→高</option>
      <option value="prog_desc">阅读进度 高→低</option>
      <option value="size_desc">体积 大→小</option>
      <option value="votes_desc">评价人数 多→少</option>
      <option value="title">书名</option>
    </select>
  </div>
  <div class="ctl"><label>命名</label>
    <select id="fmt">
      <option value="auto">自动（知名作者在前）</option>
      <option value="author">全部 作者 + 书名</option>
      <option value="title">全部 书名 + 作者</option>
    </select>
  </div>
  <div class="spacer"></div>
  <div class="syncbar"><span class="dot" id="syncDot"></span><span id="syncText">未同步</span></div>
  <span class="storebadge" id="storeBadge" title="点击查看数据体检">数据体检</span>
  <button class="btn" id="btnSync">同步书库</button>
  <button class="btn" id="btnCopy">复制选中书名</button>
  <button class="btn" id="btnNote">导出清单</button>
  <button class="btn" id="btnState">备份</button>
  <button class="btn" id="btnImport">恢复</button>
  <button class="btn" id="btnImportLib">导入书库</button>
  <button class="btn" id="btnGuide" title="查看使用说明">?</button>
  <button class="btn" id="btnHealth">数据体检</button>
  <input type="file" id="impFile" accept=".json,application/json" style="display:none">
  <input type="file" id="impLibFile" accept=".json,application/json" style="display:none">
</header>

<div class="wrap">
  <aside>
    <h4>分类</h4>
    <div id="cats"></div>
    <h4>阅读状态</h4>
    <label class="chk"><input type="radio" name="rd" value="all" checked> 全部</label>
    <label class="chk"><input type="radio" name="rd" value="read"> 已读</label>
    <label class="chk"><input type="radio" name="rd" value="unread"> 未读</label>
    <h4>我的标记</h4>
    <label class="chk"><input type="checkbox" id="fMyRate"> 有我的评分</label>
    <label class="chk"><input type="checkbox" id="fReading"> 在读（0 &lt; 进度 &lt; 100%）</label>
    <label class="chk"><input type="checkbox" id="fFinished"> 已读完</label>
    <label class="chk"><input type="checkbox" id="fNotes"> 有笔记</label>
    <h4>筛选</h4>
    <label class="chk"><input type="checkbox" id="fDup"> 仅看重名</label>
    <label class="chk"><input type="checkbox" id="fScan"> 含扫描图册</label>
    <label class="chk"><input type="checkbox" id="fTag"> 有清理标签</label>
    <h4>数据完整度</h4>
    <label class="chk"><input type="checkbox" id="fNoRate"> 未匹配豆瓣</label>
    <label class="chk"><input type="checkbox" id="fSuspect"> 仅待核实</label>
    <label class="chk"><input type="checkbox" id="fJunk"> 疑似非书</label>
    <h4>本地同步</h4>
    <label class="chk"><input type="checkbox" id="fHide" checked> 隐藏已删除</label>
    <label class="chk"><input type="checkbox" id="fPartial"> 仅部分缺失</label>
    <div class="mini" id="syncInfo">点右上「同步书库」，只读扫描你选的文件夹，自动隐藏本地已删的书。</div>
    <div class="amb" id="ambBox" style="display:none"></div>
    <h4>最低评分</h4>
    <select id="fRate" style="width:100%">
      <option value="0">不限（含无评分）</option>
      <option value="6">≥ 6.0</option>
      <option value="7">≥ 7.0</option>
      <option value="8">≥ 8.0</option>
      <option value="8.5">≥ 8.5</option>
      <option value="9">≥ 9.0</option>
    </select>
    <div class="mini" id="sideStat"></div>
  </aside>

  <main>
    <div class="statbar" id="stat"></div>
    <div class="list" id="list"></div>
    <div class="empty" id="empty" style="display:none">没有符合条件的书</div>
  </main>
</div>

<footer>
  <div class="n">已选 <b id="selN">0</b> 本</div>
  <button class="btn" id="selAll">全选当前结果</button>
  <button class="btn" id="selNone">清空选择</button>
  <span class="sep"></span>
  <button class="btn primary" id="btnCopy2">复制书名</button>
  <select id="bulkCat"></select>
  <button class="btn" id="btnCat">改分类</button>
  <span class="hint">评分/页数/笔记只存在本机；笔记正文存浏览器数据库，备份时自动合并成一个文件。</span>
</footer>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dTitle">
  <div class="dhead">
    <b id="dTitle">笔记</b>
    <button class="mini-btn" id="dClose">关闭</button>
  </div>
  <div class="dbody">
    <section>
      <h5>阅读进度</h5>
      <div class="drow">
        <input id="dRead" type="number" min="0" step="1" inputmode="numeric" placeholder="已读">
        <span style="color:var(--txt3)">/</span>
        <input id="dTotal" type="number" min="1" step="1" inputmode="numeric" placeholder="总页数">
        <button class="mini-btn" id="dUseDouban">用豆瓣页数</button>
      </div>
      <i class="bar big"><b id="dBar"></b></i>
      <div class="dhint" id="dPageHint"></div>

    ['社会·纪实·新闻', /医疗|教育|城市|乡村|人口/],
    ['商业·经济·管理', /经济|财富|生意/],
    ['心理·认知·思维', /记忆|专注|意识|性格/],
    ['文学·小说', /传奇|史诗|叙事|读物/],
    ['传记·回忆录·口述', /杂忆|往事|岁月/],
    ['推理·悬疑', /犯罪|谜案|凶案/]
  ];

  // 前端无豆瓣简介，保留常量以对齐 Python，但不参与投票
  var INTRO_RULES = [
    ['科幻·奇幻', /科幻小说|科幻作品|奇幻小说|赛博朋克|反乌托邦|外星文明|星际旅行/i, /未来世界|宇宙飞船|魔法/i],
    ['推理·悬疑', /推理小说|侦探小说|悬疑小说|本格推理|密室/i, /凶手|案件|谋杀|悬疑/i],
    ['文学·小说', /小说|散文集|诗集|文学批评|文学史|词话|长篇|短篇/i, /散文|诗歌|主人公/i]
  ];

  var TIE_ORDER = CATEGORIES.filter(function (c) { return c !== '文学·小说'; }).concat(['文学·小说']);
  var PENDING = '待归类·资料杂项';

  function bump(sc, cat, n) { sc[cat] = (sc[cat] || 0) + n; }

  function classify(title, author, dirHint, subdirHint, intro, pathParts) {
    var t = title || '', a = author || '';
    for (var i = 0; i < LOCK_RULES.length; i++) {
      if (LOCK_RULES[i][1].test(t)) return [LOCK_RULES[i][0], 'lock'];
    }

    var sc = {}, hasDir = false, hasStrong = false, hasIntro = false;
    var pp = pathParts || [];
    for (var p = 0; p < pp.length; p++) {
      if (SUBDIR_CATEGORY[pp[p]]) { bump(sc, SUBDIR_CATEGORY[pp[p]], 6); hasDir = true; }
    }
    if (subdirHint && SUBDIR_CATEGORY[subdirHint]) { bump(sc, SUBDIR_CATEGORY[subdirHint], 6); hasDir = true; }
    if (dirHint && DIR_CATEGORY[dirHint]) { bump(sc, DIR_CATEGORY[dirHint], 5); hasDir = true; }

    for (var s = 0; s < TITLE_STRONG.length; s++) {
      var pat = TITLE_STRONG[s][1];
      var g = new RegExp(pat.source, 'gi');
      var hits = (t.match(g) || []).length;
      if (hits) { bump(sc, TITLE_STRONG[s][0], 4 * Math.min(hits, 2)); hasStrong = true; }
    }
    for (var ar = 0; ar < AUTHOR_RULES.length; ar++) {
      if (AUTHOR_RULES[ar][1].test(a)) bump(sc, AUTHOR_RULES[ar][0], 2);
    }
    for (var w = 0; w < TITLE_WEAK.length; w++) {
      if (TITLE_WEAK[w][1].test(t)) bump(sc, TITLE_WEAK[w][0], 2);
    }

    var snippet = intro ? String(intro).slice(0, 400) : '';
    if (snippet) {
      for (var ir = 0; ir < INTRO_RULES.length; ir++) {
        if (INTRO_RULES[ir][1].test(snippet)) { bump(sc, INTRO_RULES[ir][0], 3); hasIntro = true; }
        else if (INTRO_RULES[ir][2].test(snippet)) { bump(sc, INTRO_RULES[ir][0], 1); hasIntro = true; }
      }
    }

    var keys = Object.keys(sc);
    if (!keys.length) return [PENDING, 'pending'];
    var best = Math.max.apply(null, keys.map(function (k) { return sc[k]; }));
    if (best < 2) return [PENDING, 'pending'];
    var win = null;
    for (var o = 0; o < TIE_ORDER.length; o++) {
      if (sc[TIE_ORDER[o]] === best) { win = TIE_ORDER[o]; break; }
    }
    if (!win) return [PENDING, 'pending'];
    var src = (hasDir && sc[win] >= 5) ? 'dir'
            : (hasStrong && sc[win] >= 4) ? 'keyword'
            : hasIntro ? 'intro' : 'vote';
    return [win, src];
  }

  // ---------------------------------------------------------------- 生成书卡
  function buildCards(fileList) {
    var groups = new Map();
    (fileList || []).forEach(function (f) {
      var rel = normRel(f.rel);
      var name = f.name || rel.split('/').pop() || '';
      if (!name || NON_BOOK_RE.test(name)) return;
      var parsed = parseFilename(name);
      if (!parsed.title) return;
      var tag = volumeLabel(name);
      var parts = rel.split('/').filter(Boolean);
      var dirHint = parts[0] || '';
      var subdirHint = parts[1] || '';
      var cat = classify(parsed.title, parsed.author || '', dirHint, subdirHint, '', parts.slice(0, -1));
      var key = normKey(parsed.title) + '|' + (tag ? tag[0] : '');
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push({ f: f, rel: rel, name: name, parsed: parsed, tag: tag, cat: cat });
    });

    var cards = [];
    groups.forEach(function (members, key) {
      members.sort(function (a, b) {
        return (b.f.size || 0) - (a.f.size || 0) || a.rel.localeCompare(b.rel);
      });
      var head = members[0];
      var files = members.map(function (m) {
        return { rel: m.rel, size: m.f.size || 0, ext: m.f.ext || '', mtime: m.f.mtime || 0 };
      });
      var totalSize = files.reduce(function (n, f) { return n + f.size; }, 0);
      var title = head.parsed.title;
      var volLabel = null;
      if (head.tag) {
        volLabel = head.tag[1];
        var short = volLabel.replace(/[（()）]/g, '');
        if (title.indexOf(short) < 0) title = title + ' · ' + short;
      }
      var sk = makeSk('file', head.rel);
      cards.push({
        sk: sk,
        id: 'f:' + hash8(sk + '|' + files.length),
        kind: 'file',
        rel: head.rel,
        name: head.name,
        title: title,
        author: head.parsed.author || '',
        author_from: head.parsed.author_from || 'scan',
        ext: head.f.ext || '',
        size: head.f.size || 0,
        total_size: totalSize,
        mtime: head.f.mtime || 0,
        volume: head.parsed.volume || null,
        series: head.parsed.series || null,
        volume_label: volLabel,
        category: head.cat[0],
        category_src: 'scan',
        dup_count: files.length,
        files: files,
        rating: 0,
        votes: 0,
        douban: {},
        oneline: '',
        intro_short: '',
        author_famous: false,
        suspect: false,
        read: false,
        locked_keep: false,
        __src: 'scan'
      });
    });
    cards.sort(function (a, b) { return a.title.localeCompare(b.title, 'zh'); });
    return cards;
  }

  // ---------------------------------------------------------------- 目录遍历
  // File System Access API：只读遍历，返回 [{rel,name,ext,size,mtime}]
  async function collectFromHandle(dirHandle, opts) {
    opts = opts || {};
    var extSet = new Set(opts.bookExt || BOOK_EXT_DEFAULT);
    var cap = opts.sizeCap || 20000;
    var out = [];
    async function rec(handle, prefix) {
      for await (var entry of handle.values()) {
        if (out.length >= cap) return;
        if (entry.name.endsWith('.sdr')) continue;
        var rel = prefix + entry.name;
        if (entry.kind === 'directory') { await rec(entry, rel + '/'); continue; }
        var dot = entry.name.lastIndexOf('.');
        if (dot < 0) continue;
        var ext = entry.name.slice(dot).toLowerCase();
        if (!extSet.has(ext)) continue;
        var size = 0, mtime = 0;
        try {
          var file = await entry.getFile();
          size = file.size || 0;
          mtime = Math.floor((file.lastModified || 0) / 1000);
        } catch (e) { /* 取不到体积仍记录文件 */ }
        out.push({ rel: normRel(rel), name: entry.name, ext: ext, size: size, mtime: mtime });
      }
    }
    await rec(dirHandle, '');
    return out;
  }

  return {
    BOOK_EXT_DEFAULT: BOOK_EXT_DEFAULT,
    CATEGORIES: CATEGORIES,
    normRel: normRel,
    makeSk: makeSk,
    stripExt: stripExt,
    parseFilename: parseFilename,
    volumeLabel: volumeLabel,
    normKey: normKey,
    classify: classify,
    buildCards: buildCards,
    collectFromHandle: collectFromHandle,
    hash8: hash8
  };
});
</script>
<script>
(function(){
"use strict";
const DS = window.EbooklibScan || null;
const DB = JSON.parse(document.getElementById('LIBRARY_DATA').textContent);
const BOOKS = DB.books || [];
const SCANS = DB.scansets || [];
let ALL = BOOKS.concat(SCANS);
let BY_SK = new Map(ALL.map(b=>[b.sk,b]));
let BY_ID = new Map(ALL.map(b=>[b.id,b]));
const META = DB.meta || {};
let LIB_SOURCE = META.source || 'embedded';
const BOOK_EXT = new Set((META.book_ext||['.mobi','.epub','.pdf','.azw3','.azw','.kfx','.txt','.doc','.docx']).map(e=>e.toLowerCase()));

/* ---------- 存储命名空间搬迁：只复制、不删除、可回滚 ----------
   历史版本把评分 / 进度 / 笔记写在另一套前缀下。这里按「后缀形态」识别，
   原样复制到新键；旧键一律保留，任何时候都能回退。
   本段必须同步执行，且早于下面 state 从 localStorage 初始化的动作。 */
const LS_NS='ebooklib_';
const LS_SUFFIX=['library_state_v1','library_state_v2','library_state_v3',
  'library_state_v1_backup','library_state_v2_backup','library_state_v3_preRmap',
  'notes_v3','has_library_v1','welcome_seen_v1'];
function lsSuffixOf(k){
  return LS_SUFFIX.find(s=>k===s || k.endsWith('_'+s)) || null;
}
function seedLegacyLocalStorage(){
  try{
    let keys=[];
    for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k) keys.push(k); }
    for(const k of keys){
      if(k.indexOf(LS_NS)===0) continue;              // 新键与旧键都不动
      const suf=lsSuffixOf(k); if(!suf) continue;
      const nk=LS_NS+suf;
      if(localStorage.getItem(nk)===null){
        const raw=localStorage.getItem(k);
        if(raw!==null) localStorage.setItem(nk,raw);   // 原样复制，不解析不重排
      }
    }
    const MIG_KEY=LS_NS+'migrated_v1';
    if(localStorage.getItem(MIG_KEY)===null) localStorage.setItem(MIG_KEY,'1');
  }catch(e){}
}
/* 双读：万一搬迁被浏览器策略拦下，仍能读到历史值，不白屏不丢分。
   写入一律只用新键，历史数据冻结保留。 */
function readLS(nk){
  try{
    const v=localStorage.getItem(nk);
    if(v!==null) return v;
    const suf=nk.indexOf(LS_NS)===0 ? nk.slice(LS_NS.length) : null;
    if(!suf) return null;
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(k && k!==nk && (k===suf || k.endsWith('_'+suf))) return localStorage.getItem(k);
    }
  }catch(e){}
  return null;
}
seedLegacyLocalStorage();

const LS_V1='ebooklib_library_state_v1', LS_V2='ebooklib_library_state_v2', LS_V3='ebooklib_library_state_v3';
const LS_NOTES='ebooklib_notes_v3';           // 仅 IDB 不可用时的降级正文区
let state={read:{},note:{},tag:{},fmt:{},cat:{},hidden:{},
           rating:{},page:{},link:{},noteIndex:{}};
try{
  const s3=JSON.parse(readLS(LS_V3)||'null');
  const s2=JSON.parse(readLS(LS_V2)||'null');
  const src = s3 || ((s2 && (!s2.__v || s2.__v===2)) ? s2 : null);
  if(src) Object.assign(state, src);
  else if(s2) Object.assign(state, s2);
}catch(e){}
['rating','page','link','noteIndex','read','note','tag','fmt','cat','hidden','autoHidden'].forEach(k=>{
  if(!state[k] || typeof state[k]!=='object') state[k]={};
});
/* 隐藏 = 你手工隐藏的 + 同步判定已删的（两者分开存，同步不会清掉手工隐藏） */
function isHidden(b){ return !!(state.hidden[b.sk] || state.autoHidden[b.sk]); }

/* 笔记正文：内存 Map，单一真源是 IndexedDB（不可用时降级 localStorage） */
const NOTES=new Map();

function migrate(){
  if(readLS(LS_V2) || readLS(LS_V3)) return;
  let v1=null;
  try{ v1=JSON.parse(readLS(LS_V1)||'null'); }catch(e){}
  if(!v1) return;
  const IDMAP=DB.idmap||{};
  let hit=0, miss=0;
  ['read','note','tag','fmt','cat'].forEach(k=>{
    Object.entries(v1[k]||{}).forEach(([oid,val])=>{
      const sk=IDMAP[oid];
      if(sk){ state[k][sk]=val; hit++; } else miss++;
    });
  });
  try{ localStorage.setItem(LS_V1+'_backup', JSON.stringify(v1)); }catch(e){}
  console.log('状态迁移：', hit, '条，未映射', miss, '条');
  save();
}

/* ---------- v2 → v3 迁移：先把笔记正文落进 IDB，成功才清 state.note ---------- */
async function migrateV3(){
  await loadNotes();
  if(state.__v===3){ rebuildNoteIndex(); return; }
  // 先把 v2 原文整体存一份，出问题可回滚
  try{
    const v2raw=readLS(LS_V2);
    if(v2raw && !readLS(LS_V2+'_backup')) localStorage.setItem(LS_V2+'_backup', v2raw);
  }catch(e){}

  let n=0, chars=0;
  Object.entries(state.note||{}).forEach(([sk,txt])=>{
    if(typeof txt!=='string' || !txt.trim()) return;
    if(NOTES.has(sk)) return;                 // IDB 已有更新的，不覆盖
    NOTES.set(sk,{text:txt, up:Date.now()});
    n++; chars+=txt.length;
  });
  const ok = n ? await flushNotesNow() : true;
  rebuildNoteIndex();
  if(ok){ state.note={}; }                    // 正文已在 IDB，清空防重复
  state.__v=3;
  saveNow();
  console.log(`[v3] 笔记迁移 ${n} 条 / ${chars} 字，IDB ${ok?'OK':'失败(降级)'}`);
  if(n) toast(`已升级笔记存储：${n} 条正文已迁入浏览器数据库`);
}
function rebuildNoteIndex(){
  state.noteIndex={};
  NOTES.forEach((v,sk)=>{ if(v && v.text) state.noteIndex[sk]={len:v.text.length, up:v.up||0}; });
}

let saveT=null;
function save(){
  state.__v=3;
  clearTimeout(saveT);
  saveT=setTimeout(saveNow,350);
}
function saveNow(){
  try{ localStorage.setItem(LS_V3,JSON.stringify(state)); }
  catch(e){
    console.error('状态保存失败',e);
    // 配额满：把已迁空的 note 再清一次再试，仍失败则明确提示，不再静默吞掉
    try{ state.note={}; localStorage.setItem(LS_V3,JSON.stringify(state)); }
    catch(e2){ toast('浏览器存储已满，请先点「备份」导出，再清理旧数据'); }
  }
}
/* 评分等关键状态同步落盘：打完分立刻刷新 / 关标签页也不能丢。
   其余高频输入（页数、标签）仍走 350ms debounce，但在页面隐藏或卸载前强制 flush。 */
function saveImmediate(){
  state.__v=3;
  if(saveT){ clearTimeout(saveT); saveT=null; }
  saveNow();
}
function flushPending(){
  if(saveT){ clearTimeout(saveT); saveT=null; saveNow(); }
}
addEventListener('pagehide', flushPending);
addEventListener('beforeunload', flushPending);
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='hidden') flushPending();
});

let F={cat:'全部',rd:'all',dup:false,scan:true,tag:false,minR:0,q:'',noRate:false,suspect:false,junk:false,
       hide:true,partial:false,myRate:false,reading:false,finished:false,notes:false};
const sel=new Set();
let lastIdx=-1;
let SYNC=null;

/* ---------- IndexedDB：同步句柄 + 笔记正文 ---------- */
const SYNC_DB='ebooklib_sync_v1', SYNC_VER=2;
let IDB_OK=true;
function idb(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open(SYNC_DB,SYNC_VER);
    r.onupgradeneeded=()=>{
      const db=r.result;
      if(!db.objectStoreNames.contains('kv')) db.createObjectStore('kv');
      if(!db.objectStoreNames.contains('notes')) db.createObjectStore('notes');
    };
    r.onsuccess=()=>res(r.result);
    r.onerror=()=>rej(r.error);
  });
}
async function idbGet(k){ try{ const db=await idb(); return await new Promise(res=>{ const tx=db.transaction('kv','readonly'); const g=tx.objectStore('kv').get(k); g.onsuccess=()=>res(g.result); g.onerror=()=>res(null); }); }catch(e){ return null; } }
async function idbPut(k,v){ try{ const db=await idb(); return await new Promise(res=>{ const tx=db.transaction('kv','readwrite'); tx.objectStore('kv').put(v,k); tx.oncomplete=()=>res(true); tx.onerror=()=>res(false); }); }catch(e){ return false; } }
async function idbNotesAll(){
  try{ const db=await idb(); return await new Promise(res=>{
    const tx=db.transaction('notes','readonly'); const g=tx.objectStore('notes').getAll(); const k=tx.objectStore('notes').getAllKeys();
    tx.oncomplete=()=>res({keys:k.result||[],vals:g.result||[]}); tx.onerror=()=>res(null);
  }); }catch(e){ return null; }
}
async function idbNotesPutMany(items){          // items: [[sk,{text,up}], ...]
  try{ const db=await idb(); return await new Promise(res=>{
    const tx=db.transaction('notes','readwrite'); const st=tx.objectStore('notes');
    items.forEach(([sk,v])=>st.put(v,sk));
    tx.oncomplete=()=>res(true); tx.onerror=()=>res(false);
  }); }catch(e){ return false; }
}
async function idbNotesDelMany(keys){
  if(!keys || !keys.length) return true;
  if(IDB_OK){
    try{ const db=await idb(); const ok=await new Promise(res=>{
      const tx=db.transaction('notes','readwrite'); const st=tx.objectStore('notes');
      keys.forEach(k=>{ try{ st.delete(k); }catch(e){} });
      tx.oncomplete=()=>res(true); tx.onerror=()=>res(false);
    }); if(ok) return true; }catch(e){}
    IDB_OK=false;
  }
  try{
    const o=JSON.parse(readLS(LS_NOTES)||'{}');
    keys.forEach(k=>{ delete o[k]; });
    localStorage.setItem(LS_NOTES,JSON.stringify(o));
  }catch(e){}
  return true;
}
async function idbNotesClear(){
  try{ const db=await idb(); return await new Promise(res=>{
    const tx=db.transaction('notes','readwrite'); tx.objectStore('notes').clear();
    tx.oncomplete=()=>res(true); tx.onerror=()=>res(false);
  }); }catch(e){ return false; }
}
async function loadNotes(){
  const r=await idbNotesAll();
  if(r && r.keys){ r.keys.forEach((sk,i)=>{ const v=r.vals[i]; if(v&&typeof v==='object') NOTES.set(sk,v); }); IDB_OK=true; return; }
  IDB_OK=false;
  try{
    const m=JSON.parse(readLS(LS_NOTES)||'{}');
    Object.entries(m).forEach(([sk,v])=>{ if(v&&v.text) NOTES.set(sk,v); });
    console.warn('[notes] IndexedDB 不可用，降级 localStorage');
  }catch(e){}
}
async function flushNotesNow(){
  if(!NOTES.size) { if(!IDB_OK){ try{localStorage.setItem(LS_NOTES,'{}');}catch(e){} } return true; }
  if(IDB_OK){
    const ok=await idbNotesPutMany([...NOTES]);
    if(ok) return true;
    IDB_OK=false; console.warn('[notes] IDB 写入失败，降级 localStorage');
  }
  try{
    const o={}; NOTES.forEach((v,k)=>o[k]=v);
    localStorage.setItem(LS_NOTES,JSON.stringify(o));
    return true;
  }catch(e){ toast('笔记保存失败：存储空间不足，请先「备份」导出'); return false; }
}
let noteT=null, noteDirty=false;
function setNote(sk,text){
  const t=String(text==null?'':text);
  if(t.trim()) NOTES.set(sk,{text:t, up:Date.now()});
  else NOTES.delete(sk);
  if(t.trim()) state.noteIndex[sk]={len:t.length, up:(NOTES.get(sk)||{}).up||0};
  else delete state.noteIndex[sk];
  noteDirty=true;
  clearTimeout(noteT);
  noteT=setTimeout(async()=>{ noteDirty=false; const ok=await flushNotesNow(); stampSaved(ok); },700);
}
function noteText(sk){ const v=NOTES.get(sk); return v&&v.text?v.text:''; }
function hasNote(sk){ return !!(noteText(sk).trim() || state.link[sk]); }
function stampSaved(ok){
  const el=document.getElementById('dNoteHint');
  if(!el) return;
  const t=new Date();
  el.textContent = ok===false ? '保存失败（存储已满，请先备份）'
    : `已保存 ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')} · 正文存本机浏览器`;
}

function normr(s){ return (s||'').replace(/\\/g,'/').toLowerCase(); }
const REL2SK=new Map();
ALL.forEach(b=>{ if(b.kind==='scanset'){ if(b.rel) REL2SK.set(normr(b.rel),b.sk); } else (b.files||[]).forEach(f=>{ if(f.rel) REL2SK.set(normr(f.rel),b.sk); }); });

/* ================= 书单替换 / 持久化 / 从零扫描 =================
   页面内嵌的书单是构建期静态数据；这里让它在运行时可被
   「前端扫描」「导入书库 JSON」「示例数据」三种来源替换。
   关键：替换只动书卡数组，state（评分/进度/笔记/隐藏）一个键都不动。 */
const LS_HAS_LIB='ebooklib_has_library_v1', LS_SEEN='ebooklib_welcome_seen_v1';
const LIB_KEY='userLibrary';
let WELCOME_OPEN=false, LOCK_N=0;

function withTimeout(p,ms){
  return Promise.race([
    Promise.resolve(p).catch(()=>null),
    new Promise(r=>setTimeout(()=>r('__timeout__'),ms))
  ]);
}
/* ---------- IndexedDB 历史库整库复制（只复制、不删除、幂等） ----------
   数据库名不能原地改。历史库里的 kv（书单本体 / 目录句柄 / 同步记录）
   与 notes（笔记正文）必须原样搬过来；目录句柄是结构化克隆对象，
   只能原样 put，绝不能 JSON 化。旧库一个字节都不删，随时可回退。 */
function legacyDBNames(){
  // 字符码构造历史库名：源码里不留旧代号明文，仅在 databases() 不可用时兜底
  return [String.fromCharCode(100,97,115,104,97,110,95,115,121,110,99,95,118,49)];
}
function openLegacyDB(name){
  return new Promise(res=>{
    try{
      const r=indexedDB.open(name);
      r.onupgradeneeded=()=>{ try{ r.transaction.abort(); }catch(e){} };
      r.onsuccess=()=>res(r.result);
      r.onerror=()=>res(null);
    }catch(e){ res(null); }
  });
}
function readStoreAll(db,store){
  return new Promise(res=>{
    try{
      const tx=db.transaction(store,'readonly'), o=tx.objectStore(store);
      const kr=o.getAllKeys(), vr=o.getAll();
      let keys=null, vals=null;
      const done=()=>{ if(keys&&vals) res({keys:keys,vals:vals}); };
      kr.onsuccess=()=>{ keys=kr.result; done(); };
      vr.onsuccess=()=>{ vals=vr.result; done(); };
      kr.onerror=vr.onerror=()=>res(null);
      tx.onerror=()=>res(null);
    }catch(e){ res(null); }
  });
}
function writeStoreAll(db,store,data){
  return new Promise(res=>{
    try{
      const tx=db.transaction(store,'readwrite'), o=tx.objectStore(store);
      (data.keys||[]).forEach((k,i)=>o.put(data.vals[i],k));
      tx.oncomplete=()=>res(true);
      tx.onerror=()=>res(false);
    }catch(e){ res(false); }
  });
}
async function seedLegacyIDB(){
  try{
    const cur=await withTimeout(idbGet('userLibrary'),1200);
    if(cur && cur!=='__timeout__' && Array.isArray(cur.books) && cur.books.length) return;
    let names=[];
    try{
      if(indexedDB.databases){
        const dbs=await indexedDB.databases();
        names=(dbs||[]).map(d=>d.name).filter(n=>n && n!==SYNC_DB);
      }
    }catch(e){}
    if(!names.length) names=legacyDBNames();
    for(const name of names){
      if(name===SYNC_DB) continue;
      const old=await withTimeout(openLegacyDB(name),800);
      if(!old || old==='__timeout__') continue;
      if(!old.objectStoreNames.contains('kv') || !old.objectStoreNames.contains('notes')){ old.close(); continue; }
      const kv=await readStoreAll(old,'kv'), notes=await readStoreAll(old,'notes');
      old.close();
      if(!kv && !notes) continue;
      const fresh=await idb();
      if(kv) await writeStoreAll(fresh,'kv',kv);
      if(notes) await writeStoreAll(fresh,'notes',notes);
      break;
    }
  }catch(e){}
}

function migrateLegacySk(){
  const pairs=[], seen=new Set();
  ['read','tag','cat','hidden','autoHidden','rating','page','link','noteIndex'].forEach(k=>{
    const m=state[k]||{};
    Object.keys(m).forEach(sk=>{

    const nk=sk.replace(/\\/g,'/');

function normalizeCard(b){
  const o=Object.assign({},b);
  const fix=r=>{
    let x=String(r||'').replace(/\\/g,'/');
    const lead=x.charAt(0), colon=x.charAt(1);
    if(colon===':' && /^[A-Za-z]$/.test(lead)) x=x.split('/').pop()||x;  // 绝不保留绝对路径
    return x;
  };
  delete o.path; delete o.dir;
  o.rel=fix(o.rel);
  o.files=(o.files||[]).map(f=>{ const g=Object.assign({},f); delete g.path; delete g.dir; g.rel=fix(g.rel); return g; });
  if(!o.sk) o.sk=(o.kind==='scanset'?'dir:':'path:')+o.rel;
  else o.sk=String(o.sk).replace(/\\/g,'/');
  if(!o.id) o.id='f:'+(DS?DS.hash8(o.sk):'00000000');
  o.rating=o.rating||0; o.votes=o.votes||0; o.douban=o.douban||{};
  o.oneline=o.oneline||''; o.intro_short=o.intro_short||'';
  o.dup_count=o.dup_count||o.files.length||1;
  return o;
}

/* 文件名主干（小写、去扩展名）——用于判断「是不是同一本书被搬走了」 */
function baseOf(rel){
  const s=normr(rel).split('/').pop()||'';
  const dot=s.lastIndexOf('.');
  return dot>0 ? s.slice(0,dot) : s;
}
const SIZE_CAP=1200;                       // 新增文件过多时不逐个取体积，退化为人工确认
function pushIdx(map,k,v){ if(!k) return; let a=map.get(k); if(!a){ a=[]; map.set(k,a); } a.push(v); }

async function walk(dir,prefix,files,dirs,cands){
  for await(const e of dir.values()){
    if(e.name.endsWith('.sdr')) continue;
    const rel=prefix+e.name;
    if(e.kind==='directory'){ dirs.push(rel); await walk(e, rel+'/', files, dirs, cands); continue; }
    const dot=e.name.lastIndexOf('.');
    if(dot<0) continue;
    if(!BOOK_EXT.has(e.name.slice(dot).toLowerCase())) continue;
    files.push(rel);
    if(cands && !REL2SK.has(normr(rel))) cands.push({h:e, rel});   // 只给「陌生文件」取体积
  }
}
async function sizesOf(cands){
  const out=new Map();
  for(const c of cands){
    try{ const f=await c.h.getFile(); out.set(normr(c.rel), f.size); }
    catch(e){ out.set(normr(c.rel), null); }
  }
  return out;
}

/* diff v3：moved=旧rel(归一化)→新rel；amb=待人工确认；gone=真删除 */
function computeDiff(files,dirs,newSizes){
  const disk=new Set(files.map(normr));
  const dset=new Set(dirs.map(normr));
  const neu=[];
  files.forEach(r=>{ if(!REL2SK.has(normr(r))) neu.push(r); });

  // 候选索引（只在新增文件上建）
  const byBS=new Map(), byB=new Map(), byS=new Map();
  neu.forEach(r=>{
    const k=normr(r), b=baseOf(r), sz=(newSizes&&newSizes.has(k))?newSizes.get(k):null;
    pushIdx(byB,b,r);
    if(sz!=null){ pushIdx(byS,sz,r); pushIdx(byBS,b+'|'+sz,r); }
  });
  const claimed=new Set();
  const pick=cands=>{ for(const x of cands){ const k=normr(x); if(!claimed.has(k)){ claimed.add(k); return x; } } return null; };

  const moved={}, amb=[], gone=[], miss={};
  ALL.forEach(b=>{
    if(b.kind==='scanset'){
      const oldRel=b.rel||'';
      if(oldRel && dset.has(normr(oldRel))) return;
      const bname=normr(oldRel).split('/').filter(Boolean).pop()||'';
      const hits=bname? dirs.filter(d=>normr(d).split('/').filter(Boolean).pop()===bname) : [];
      const uniq=hits.filter(h=>!claimed.has(normr(h)));
      if(uniq.length===1){ moved[normr(oldRel)]=uniq[0]; claimed.add(normr(uniq[0])); }
      else gone.push(b.sk);
      return;
    }
    const rels=(b.files||[]).map(f=>f.rel).filter(Boolean);
    if(!rels.length) return;
    const lost=rels.filter(r=>!disk.has(normr(r)));
    if(!lost.length) return;
    const resolved={};
    lost.forEach(oldRel=>{
      const f=(b.files||[]).find(x=>x.rel===oldRel)||{};
      const bs=baseOf(oldRel), sz=(f.size!=null?f.size:null);
      const bsArr=(bs&&sz!=null)?(byBS.get(bs+'|'+sz)||[]):[];
      const bArr=bs?(byB.get(bs)||[]):[];
      const sArr=(sz!=null)?(byS.get(sz)||[]):[];
      let hit=null, reason='';
      if(bsArr.length===1) hit=pick([bsArr[0]]);
      else if(bsArr.length>1) reason='multi';                       // 同名同体积多个候选
      else if(bArr.length===1 && sz==null) hit=pick([bArr[0]]);      // 无体积信息，仅名字唯一
      else if(bArr.length) reason=(sz!=null?'size':'multi');         // 名字对上但体积不同
      else if(sArr.length===1) reason='rename';                      // 体积唯一 → 疑似改名搬家
      if(hit){ moved[normr(oldRel)]=hit; resolved[oldRel]=hit; }
      else amb.push({sk:b.sk, oldRel, size:sz, reason:reason||'none',
                     cands:(bsArr.length?bsArr:(bArr.length?bArr:sArr)).slice(0,8)});
    });
    const alive=rels.length-lost.length+Object.keys(resolved).length;
    if(alive<=0){ gone.push(b.sk); return; }
    const l=lost.filter(r=>!resolved[r]);
    if(l.length) miss[b.sk]=l;
  });
  return {v:3, ts:Date.now(), gone, miss, moved, amb,
          neu:neu.filter(r=>!claimed.has(normr(r))), total:files.length};
}

/* ---------- 应用「移动」：改 rel → 改 sk → 迁移本机状态（幂等） ---------- */
const ST_KEYS=['read','tag','cat','hidden','rating','page','link','noteIndex'];
let PENDING_DEL=[];
function reindex(){
  REL2SK.clear();
  ALL.forEach(b=>{
    if(b.kind==='scanset'){ if(b.rel) REL2SK.set(normr(b.rel),b.sk); }
    else (b.files||[]).forEach(f=>{ if(f.rel) REL2SK.set(normr(f.rel),b.sk); });
  });
  BY_SK.clear(); ALL.forEach(b=>BY_SK.set(b.sk,b));
}
async function migrateKeys(pairs){
  let n=0;
  pairs.forEach(([o,nk])=>{
    if(o===nk) return;
    ST_KEYS.forEach(k=>{
      const m=state[k]; if(!m) return;
      if(Object.prototype.hasOwnProperty.call(m,o) && !Object.prototype.hasOwnProperty.call(m,nk)){
        m[nk]=m[o]; delete m[o]; n++;
      }
    });
    if(NOTES.has(o) && !NOTES.has(nk)){ NOTES.set(nk,NOTES.get(o)); PENDING_DEL.push(o); }
  });
  if(!n && !PENDING_DEL.length) return 0;
  saveNow();
  const ok=await flushNotesNow();                 // 先确保新键落盘，再删旧键
  if(ok && PENDING_DEL.length){
    await idbNotesDelMany(PENDING_DEL);           // 存储里删掉旧键
    PENDING_DEL.forEach(k=>NOTES.delete(k));      // 内存里同步删，避免下次 flush 又写回来
    PENDING_DEL=[];
  }
  rebuildNoteIndex(); saveNow();
  return n;
}
async function applyMoved(moved){
  if(!moved || !Object.keys(moved).length) return 0;
  const pairs=[];
  let n=0;
  ALL.forEach(b=>{
    let changed=false;
    if(b.kind==='scanset'){
      const nr=moved[normr(b.rel||'')];
      if(nr && nr!==b.rel){ pairs.push([b.sk,'dir:'+nr]); b.__movedFrom=b.__movedFrom||b.rel; b.__movedTo=nr; b.rel=nr; b.sk='dir:'+nr; changed=true; }
    }else{
      (b.files||[]).forEach(f=>{ const nr=moved[normr(f.rel||'')]; if(nr && nr!==f.rel){ b.__movedFrom=b.__movedFrom||f.rel; b.__movedTo=nr; f.rel=nr; changed=true; } });
      const head=(b.files||[])[0];
      if(changed && head){
        b.rel=head.rel;
        const ns='path:'+head.rel;
        if(ns!==b.sk){ pairs.push([b.sk,ns]); b.sk=ns; }
      }
    }
    if(changed) n++;
  });
  if(!n) return 0;
  reindex();
  await migrateKeys(pairs);
  return n;
}
/* 按同步结果算出「当前真实存在的文件」——没同步过就是全部 */
function effFiles(b){
  const m=SYNC&&SYNC.miss&&SYNC.miss[b.sk];
  if(!m||!m.length) return b.files||[];
  const lost=new Set(m.map(normr));
  return (b.files||[]).filter(f=>!lost.has(normr(f.rel)));
}
/* 实时副本数：删掉重复副本后会自动降为 1，卡片变回普通单本 */
function effDup(b){
  if(b.kind==='scanset') return 1;
  if(!SYNC||!SYNC.miss||!SYNC.miss[b.sk]) return b.dup_count||(b.files||[]).length||1;
  return Math.max(1,effFiles(b).length);
}
/* 实时体积：只累计仍存在的文件 */
function effSize(b){
  if(b.kind==='scanset') return b.total_size||0;
  const fs=effFiles(b);
  if(!SYNC||!SYNC.miss||!SYNC.miss[b.sk]) return b.total_size||0;
  const sum=fs.reduce((a,f)=>a+(f.size||0),0);
  return sum||b.total_size||0;
}
/* 少了多少份（仅在仍是重名组时才提示） */
function missCount(b){
  const base=b.dup_count||(b.files||[]).length||1;
  const now=effDup(b);
  return now>=2 ? Math.max(0, base-now) : 0;
}
function setSyncState(txt,cls){
  document.getElementById('syncText').textContent=txt;
  const d=document.getElementById('syncDot');
  d.className='dot'+(cls?' '+cls:'');
}
async function applyDiff(d){
  SYNC=d;
  await applyMoved(d.moved||{});            // 先认领搬家，再判删除
  const goneSet=new Set(d.gone||[]);
  // hidden 增量更新：只加真删除的；文件若又回来了，自动取消隐藏
  // 自动隐藏（同步判定已删）与手工隐藏分开存，互不清掉对方
  state.autoHidden={};
  goneSet.forEach(sk=>{ state.autoHidden[sk]=1; });
  save();
  setSyncState('已同步 '+new Date(d.ts).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}),'ok');
  updateSyncInfo();
  render();
}
function movedRel(b){
  const m=SYNC&&SYNC.moved;
  if(!m) return null;
  const r=(b.kind==='scanset')?(b.rel||''):((b.files||[])[0]&&(b.files||[])[0].rel||'');
  return m[normr(r)]||null;
}
function topDir(rel){ const p=normr(rel||'').split('/').filter(Boolean); return p.length>1?p[0]:''; }
function updateSyncInfo(){
  const el=document.getElementById('syncInfo');
  if(!SYNC){ el.innerHTML='点右上「同步书库」，只读扫描你选的文件夹，自动隐藏本地已删的书。'; return; }
  let nG=(SYNC.gone||[]).length, nLost=0;
  ALL.forEach(b=>{ if(missCount(b)>0) nLost++; });
  const nN=(SYNC.neu||[]).length;
  const nM=Object.keys(SYNC.moved||{}).length;
  const nA=(SYNC.amb||[]).length;
  let h=`上次同步 ${new Date(SYNC.ts).toLocaleString('zh-CN')}<br>`;

/* 待确认面板：人工认领「这就是同一本」 */
function openAmb(){

  if(!box) return;
  const list=(SYNC&&SYNC.amb)||[];
  if(!list.length){ box.innerHTML=''; box.style.display='none'; return; }

  let h=`<div class="ambHead">待确认 ${list.length} 条 <button class="mini-btn" id="ambClose">收起</button></div>`;
  list.forEach((a,i)=>{

    const nm=b?dispName(b):a.oldRel;
    h+=`<div class="ambItem"><div class="t">${esc(nm)}<span class="rs">${esc(why[a.reason]||a.reason)}</span></div>`;
    h+=`<div class="o">原：${esc(a.oldRel)}</div>`;
    if(a.cands&&a.cands.length){
      h+=`<div class="cs">`+a.cands.map(c=>`<button class="mini-btn" data-claim="${i}" data-rel="${esc(c)}">认领 → ${esc(c.split('/').pop())}</button>`).join(' ')+`</div>`;
      h+=`<div class="o sm">${esc(a.cands[0])}</div>`;
    }else{
      h+=`<div class="o sm">没有可选的新文件（可能真的删了）</div>`;
    }
    h+=`</div>`;
  });
  box.innerHTML=h; box.style.display='block';
  const c=document.getElementById('ambClose');
  if(c) c.onclick=()=>{ box.style.display='none'; };
  box.querySelectorAll('[data-claim]').forEach(el=>{
    el.onclick=async()=>{
      const a=list[+el.dataset.claim], rel=el.dataset.rel;
      if(!a||!rel) return;
      SYNC.moved=SYNC.moved||{};
      SYNC.moved[normr(a.oldRel)]=rel;
      SYNC.amb=SYNC.amb.filter(x=>x!==a);
      await applyMoved({[normr(a.oldRel)]:rel});
      // 该条现在有文件存活了，从 hidden / gone 里撤掉（sk 可能已被搬家改写，实时取）
      const owner=ALL.find(b=>(b.files||[]).some(f=>normr(f.rel)===normr(rel)));
      const osk=owner?owner.sk:a.sk;
      delete state.autoHidden[osk];
      SYNC.gone=(SYNC.gone||[]).filter(sk=>sk!==osk);
      await idbPut('diff',SYNC);
      save(); updateSyncInfo(); render();
      toast('已认领：'+rel.split('/').pop());
    };
  });
}
async function doSync(){
  if(!('showDirectoryPicker' in window)){ return legacyPick(); }
  const h=await pickDir();
  if(!h) return;
  setSyncState('扫描中…','warn');
  try{
    const files=[],dirs=[],cands=[];
    await walk(h,'',files,dirs,cands);
    let newSizes=null;
    if(cands.length && cands.length<=SIZE_CAP){
      setSyncState('读取体积…','warn');
      newSizes=await sizesOf(cands);
    }
    const diff=computeDiff(files,dirs,newSizes);
    const risky=(diff.gone||[]).length+(diff.amb||[]).length;
    if(risky > ALL.length*0.3 && risky>20){
      if(!confirm('本次有 '+risky+' 条未匹配上（可能是整批移动/改名，或目录选错）。仍要应用吗？')) { setSyncState('已取消','warn'); return; }
    }
    await idbPut('diff',diff);
    await applyDiff(diff);
    const nM=Object.keys(diff.moved||{}).length;
    toast(`同步完成：跟随搬家 ${nM} 条 · 待确认 ${(diff.amb||[]).length} 条 · 已删 ${diff.gone.length} 条 · 新增 ${diff.neu.length} 个`);
  }catch(e){
    setSyncState('同步失败','warn'); toast('同步失败：'+(e&&e.message||e));
  }
}
function legacyPick(){
  const inp=document.createElement('input');
  inp.type='file'; inp.webkitdirectory=true; inp.multiple=true;
  inp.onchange=async()=>{
    const files=[],dirs=new Set(),sizes=new Map(),scanList=[];
    for(const f of inp.files){
      const rel=f.webkitRelativePath;
      if(!rel) continue;
      const parts=rel.split('/');
      for(let i=1;i<parts.length;i++) dirs.add(parts.slice(0,i).join('/'));
      const dot=rel.lastIndexOf('.');
      if(dot>=0 && BOOK_EXT.has(rel.slice(dot).toLowerCase())){
        files.push(rel); sizes.set(normr(rel),f.size);
        scanList.push({rel:rel.replace(/\\/g,'/'),name:parts[parts.length-1],
                       ext:rel.slice(dot).toLowerCase(),size:f.size,
                       mtime:Math.floor((f.lastModified||0)/1000)});
      }
    }
    // 在线版（示例/前端扫描）：没有内嵌真实书单，直接从零生成书卡
    if(DS && (LIB_SOURCE==='demo'||LIB_SOURCE==='scan')){
      await applyScanResult(DS.buildCards(scanList));
      return;
    }
    const diff=computeDiff(files,[...dirs],sizes);
    applyDiff(diff);
    toast(`兼容模式同步完成：跟随搬家 ${Object.keys(diff.moved||{}).length} 条`);
  };
  inp.click();
}

/* ---------- 显示 ---------- */
function dispName(b){
  const f=document.getElementById('fmt').value;
  const ov=state.fmt[b.sk];
  let mode=(ov&&ov!=='auto')?ov:(f==='auto'?(b.author_famous?'author':'title'):f);
  const t=b.title||'', a=b.author||'';
  if(!a) return t;
  return mode==='author' ? a+' · '+t : t+' · '+a;
}
function rateColor(r){
  if(r==null||r===0) return 'var(--r0)';
  if(r>=9) return 'var(--r9)';
  if(r>=8) return 'var(--r8)';
  if(r>=7) return 'var(--r7)';
  return 'var(--r6)';
}
function human(n){
  if(n==null) return '-';
  const u=['B','KB','MB','GB','TB']; let i=0; n=n*1;
  while(n>=1024&&i<u.length-1){n/=1024;i++;}
  return (i===0? n.toFixed(0):n.toFixed(1))+u[i];
}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* 疑似非书：高精度判据，只看「整本书不像」的硬信号，避免误伤短书名正版书 */
function junkScore(b){
  if(b.kind==='scanset') return 0;
  if(b.douban_status==='ok') return 0;
  let s=0; const t=(b.title||'').trim();
  const sz=b.total_size||0, ext=(b.ext||'').toLowerCase();
  const isDoc=/^(doc|docx|txt)$/.test(ext);
  // 短文/笔记类：doc/docx/txt 且体积很小，基本是文章而非整本书
  if(isDoc && sz<150*1024) s+=2;
  else if(/^(doc|docx)$/.test(ext) && sz<400*1024) s+=1;
  // 标题就是笔记/课件/报告一类
  if(/(笔记|课件|习题|答案|心得|读后感|报告|简历|模板|说明书|样章|试读|条例|守则)/.test(t)) s+=2;
  // 标题无意义：纯数字/日期（形如 2010-1）
  if(/^[\d\-_.\s]+$/.test(t) && t) s+=2;
  // 无作者且无评分，仅作微弱加权（单字书名如《家》《岛》不因此误伤）
  if(!b.author) s+=1;
  return s;
}
function effCat(b){ return state.cat[b.sk] || b.category; }
function effRead(b){ return (b.sk in state.read)? state.read[b.sk] : !!b.read; }

/* ---------- 我的评分 / 阅读进度 ---------- */
function myRate(sk){ const v=state.rating[sk]; return (typeof v==='number' && v>=1 && v<=5) ? v : 0; }
function setMyRate(sk,v){
  const n=Math.round(Number(v));
  if(n>=1 && n<=5){ state.rating[sk]=n; }
  else if(n===0 || v==null){ delete state.rating[sk]; }
  else { return; }                 // 越界值直接忽略，不动已有评分
  saveImmediate();
  updateStoreBadge();
}
function toInt(v,min=0,max=1000000){
  const s=String(v==null?'':v).replace(/[^\d]/g,'');
  if(s==='') return null;
  const n=parseInt(s,10);
  return (Number.isFinite(n) && n>=min && n<=max) ? n : null;
}
/* 分母优先级：手填 > 豆瓣页数 > 扫描图册张数 > 无 */
function pageTotal(b){
  const p=state.page[b.sk]||{};
  if(Number.isFinite(p.total) && p.total>0) return p.total;
  const dp=b.douban && b.douban.pages;
  if(Number.isFinite(dp) && dp>0) return dp;
  if(b.kind==='scanset' && b.pages>0) return b.pages;
  return null;
}
function pageTotalSrc(b){
  const p=state.page[b.sk]||{};
  if(Number.isFinite(p.total) && p.total>0) return 'mine';
  if(b.douban && Number.isFinite(b.douban.pages) && b.douban.pages>0) return 'douban';
  if(b.kind==='scanset' && b.pages>0) return 'scan';
  return null;
}
function pageRead(b){ const p=state.page[b.sk]||{}; return (Number.isFinite(p.read)&&p.read>0)? p.read : 0; }
function pagePct(b){
  const t=pageTotal(b), r=pageRead(b);
  if(!t || !r) return null;
  return Math.min(100, r/t*100);
}
function pageUnit(b){ return b.kind==='scanset' ? '张' : '页'; }
function setPage(sk,read,total){
  const o=state.page[sk]||{};
  read=toInt(read,0,1000000); total=toInt(total,1,1000000);
  if(read) o.read=read; else delete o.read;
  if(total) o.total=total; else delete o.total;
  if(o.read||o.total) state.page[sk]=o; else delete state.page[sk];
  // 单向联动：进度满自动置「已读」；反向不动
  const b=BY_SK.get(sk);
  if(b){ const t=pageTotal(b), r=pageRead(b);
    if(t && r && r>=t) state.read[sk]=true; }
  save();
}

/* ---------- URL 清洗（防 javascript: 伪协议） ---------- */
function safeUrl(u){
  const s=String(u==null?'':u).trim();
  if(!s || s.length>2048) return '';
  if(!/^https?:\/\/[^\s]+$/i.test(s)) return '';
  try{ new URL(s); }catch(e){ return ''; }
  return s;
}
function isMubu(u){
  try{ const h=new URL(u).hostname.toLowerCase(); return h==='mubu.com'||h.endsWith('.mubu.com'); }
  catch(e){ return false; }
}

/* ---------- 过滤 ---------- */
function filtered(){
  const q=F.q.trim().toLowerCase();
  let out=ALL.filter(b=>{
    if(F.hide && isHidden(b)) return false;
    if(F.cat!=='全部' && effCat(b)!==F.cat) return false;
    if(b.kind==='scanset' && !F.scan) return false;
    if(F.dup && effDup(b)<2) return false;
    const r=effRead(b);
    if(F.rd==='read' && !r) return false;
    if(F.rd==='unread' && r) return false;
    if(F.minR>0){ const rt=b.rating||0; if(rt<F.minR) return false; }
    if(F.tag && !state.tag[b.sk]) return false;
    if(F.myRate && !(myRate(b.sk)>0)) return false;
    if(F.reading){ const p=pagePct(b); if(!(p>0 && p<100)) return false; }
    if(F.finished){ const p=pagePct(b); if(!(p>=100)) return false; }
    if(F.notes && !hasNote(b.sk)) return false;
    if(F.noRate && (b.kind==='scanset' || b.rating)) return false;
    if(F.suspect && !b.suspect) return false;
    if(F.junk && junkScore(b)<2) return false;
    if(F.partial && missCount(b)<1) return false;
    if(q){
      const t=(b.title||'').toLowerCase(), a=(b.author||'').toLowerCase();
      if(!t.includes(q)&&!a.includes(q)) return false;
    }
    return true;
  });
  const s=document.getElementById('sort').value;
  const rv=b=>b.rating||0;
  const mv=b=>myRate(b.sk)*2;                 // 1–5 星 → 0–10，与豆瓣同尺度
  const pv=b=>{ const p=pagePct(b); return p==null? -1 : p; };
  out.sort((x,y)=>{
    if(s==='rating_desc') return (rv(y)||-1)-(rv(x)||-1);
    if(s==='rating_asc')  return (rv(x)||999)-(rv(y)||999);
    if(s==='mine_desc')   return (mv(y)||-1)-(mv(x)||-1) || (rv(y)||-1)-(rv(x)||-1);
    if(s==='mine_asc')    return (mv(x)||999)-(mv(y)||999) || (rv(x)||999)-(rv(y)||999);
    if(s==='prog_desc')   return pv(y)-pv(x);
    if(s==='size_desc')   return effSize(y)-effSize(x);
    if(s==='votes_desc')  return (y.votes||0)-(x.votes||0);
    return (x.title||'').localeCompare(y.title||'','zh');
  });
  return out;
}

          ${b.kind==='scanset'?'<span class="chip scan">扫描图册</span>':''}
          ${hasNote(b.sk)?'<span class="chip notes">有笔记</span>':''}

  const dupG=rows.filter(b=>effDup(b)>1).length;

  const inN=rows.filter(b=>{const p=pagePct(b);return p>0&&p<100;}).length;

function bind(){
  document.querySelectorAll('[data-pick]').forEach(el=>{
    el.onclick=e=>{
      const sk=el.dataset.pick;
      if(e.shiftKey&&lastIdx>=0){
        const rows=filtered();
        const idx=rows.findIndex(r=>r.sk===sk);
        if(idx>=0){ const a=Math.min(lastIdx,idx), b2=Math.max(lastIdx,idx); for(let i=a;i<=b2;i++) sel.add(rows[i].sk); }
      }else{ el.checked?sel.add(sk):sel.delete(sk); }
      lastIdx=filtered().findIndex(r=>r.sk===sk);
      render();
    };
  });
  document.querySelectorAll('[data-cp]').forEach(el=>{
    el.onclick=()=>{ const d=document.getElementById('cp-'+el.dataset.cp); d.classList.toggle('show'); el.textContent=d.classList.contains('show')?'收起副本':'展开副本'; };
  });
  document.querySelectorAll('[data-rd]').forEach(el=>{
    el.onclick=()=>{ const sk=el.dataset.rd, cur=effRead(BY_SK.get(sk)); state.read[sk]=!cur; save(); render(); };
  });

  });

  });
  // 卡片上的星星：点击直接打分，不复用抽屉

  });
}

/* 星标事件 + 键盘（1-5 选择，0/退格清空） */
function bindStars(sp, onPick){
  const items=[...sp.querySelectorAll('b')];
  const val=myRate(sp.dataset.sk);
  const paint=v=>items.forEach((b2,i)=>{
    b2.classList.toggle('on', i<v);
    b2.setAttribute('aria-checked', i<v?'true':'false');
    b2.tabIndex=(i===(v>0?v-1:0))?0:-1;
  });
  items.forEach((b2,i)=>{
    b2.onclick=()=>{ const v=i+1; paint(v); onPick(v); };
    b2.onkeydown=(e)=>{
      if(e.key==='Enter'||e.key===' '){ e.preventDefault(); b2.click(); }
      else if(e.key==='ArrowRight'||e.key==='ArrowLeft'){
        e.preventDefault();
        const nxt=items[Math.max(0,Math.min(items.length-1, i+(e.key==='ArrowRight'?1:-1)))];
        nxt.focus();
      }
      else if(e.key==='0'||e.key==='Backspace'||e.key==='Delete'){
        e.preventDefault(); paint(0); onPick(0);
      }
    };
  });
  paint(val);
}

let DRAW=null, drawPrevNote=null, drawFocus=null;
function fillPageHint(b){
  const sk=b.sk, t=pageTotal(b), r=pageRead(b), src=pageTotalSrc(b), u=pageUnit(b);
  const el=document.getElementById('dPageHint');
  const bar=document.getElementById('dBar');
  if(!t && !r){ el.innerHTML=`还没有页数记录。豆瓣页数未知，可以直接填「已读」。`; bar.style.width='0'; return; }
  const pct=pagePct(b);
  bar.style.width=(t&&pct!=null?pct.toFixed(1):0)+'%';
  bar.className=(t&&pct>=100)?'full':'';
  if(!t){ el.innerHTML=`已读 <b>${r}</b> ${u}；总页数未知（豆瓣没这条数据），可手填。`; return; }
  const srcTxt = src==='mine' ? '你手填的总页数' : src==='douban' ? `豆瓣页数 <b>${b.douban.pages}</b>` : `扫描图册 <b>${b.pages}</b> 张`;
  let h=`分母来源：${srcTxt}。`;
  if(r>t) h+=` <span style="color:var(--warn)">已读超出总页数 ${r-t} ${u}</span>（不清零，按你填的算）`;
  else if(pct>=100) h+=` <span style="color:var(--keep)">已读完</span>`;
  else if(pct) h+=` 已读 <b>${pct.toFixed(1)}%</b>`;
  el.innerHTML=h;
}

}

/* ---------- 复制 ---------- */
function copyText(t){
  if(navigator.clipboard&&window.isSecureContext){
    navigator.clipboard.writeText(t).then(()=>toast('已复制 '+t.split('\n').length+' 条'),()=>fallback(t));
  }else fallback(t);
}
function fallback(t){
  const ta=document.createElement('textarea');
  ta.value=t; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('已复制'); }catch(e){ toast('复制失败，请手动选择'); }
  document.body.removeChild(ta);
}
function toast(m){
  const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1800);
}

function dl(name,text,type){
  const b=new Blob([text],{type:type||'text/plain;charset=utf-8'});
  const u=URL.createObjectURL(b); const a=document.createElement('a'); a.href=u; a.download=name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a); setTimeout(()=>URL.revokeObjectURL(u),1000);
}
function exportNote(){
  const rows=ALL.filter(b=>!isHidden(b) && (state.tag[b.sk]||hasNote(b.sk)||myRate(b.sk)>0||pageRead(b)>0||sel.has(b.sk)));
  if(!rows.length){ toast('还没有笔记/评分/进度，也未选中任何书'); return; }
  const d=new Date(), ds=`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
  let t=`本地书库管理 · 我的阅读清单\n生成时间 ${d.toLocaleString('zh-CN')}\n共 ${rows.length} 条（仅供本人参考，工具不会删除任何文件）\n`;
  t+='='.repeat(70)+'\n\n';
  rows.forEach((b,i)=>{
    const u=pageUnit(b), pt=pageTotal(b), pr=pageRead(b), pct=pagePct(b);
    t+=`[${String(i+1).padStart(4,'0')}] ${dispName(b)}\n`;
    t+=`      分类 ${effCat(b)} | 豆瓣 ${b.rating?b.rating.toFixed(1):'无'} | 我的 ${myRate(b.sk)?myRate(b.sk)+' 星':'—'} | ${human(effSize(b))}\n`;
    if(pt||pr) t+=`      进度 ${pr||0} / ${pt||'?'} ${u}${pct!=null?`（${pct.toFixed(1)}%）`:''}\n`;
    if(b.douban&&b.douban.publisher) t+=`      出版社 ${b.douban.publisher}\n`;
    if(state.tag[b.sk]) t+=`      标签 ${state.tag[b.sk]}\n`;
    if(state.link[b.sk]) t+=`      幕布 ${state.link[b.sk]}\n`;
    const nt=noteText(b.sk);
    if(nt) t+=`      笔记 ${nt.replace(/\n/g,'\n           ')}\n`;
    (b.files||[]).forEach(f=>{ t+=`      · ${human(f.size)}  ${f.rel}\n`; });
    if(b.kind==='scanset') t+=`      · ${b.pages} 页图  ${b.rel}\n`;
    if(b.suspect) t+=`      · ⚠ 豆瓣待核实 ${(b.douban&&b.douban.url)||''}\n`;
    t+='\n';
  });
  dl(`我的书库阅读清单_${ds}.txt`,t);

  const q=s=>`"${String(s==null?'':s).replace(/"/g,'""')}"`;
  const csv=['书名,作者,分类,豆瓣评分,评价人数,我的评分,已读页数,总页数,进度%,出版社,体积MB,标签,幕布链接,笔记,相对路径'];
  rows.forEach(b=>{
    const p=(b.files&&b.files[0])?b.files[0].rel:(b.rel||'');
    const pt=pageTotal(b), pr=pageRead(b), pct=pagePct(b);
    csv.push([
      q(dispName(b)), q(b.author), q(effCat(b)), b.rating||'', b.votes||'',
      myRate(b.sk)||'', pr||'', pt||'', pct!=null?pct.toFixed(1):'',
      q((b.douban&&b.douban.publisher)||''),
      (effSize(b)/1048576).toFixed(1),
      q(state.tag[b.sk]||''), q(state.link[b.sk]||''),
      q(noteText(b.sk).replace(/\r?\n/g,' ⏎ ')), q(p),
    ].join(','));
  });
  dl(`我的书库阅读清单_${ds}.csv`,'\ufeff'+csv.join('\r\n'),'text/csv;charset=utf-8');
  toast('已导出阅读清单（CSV 带 BOM，Excel 直接打开不乱码）');
}

async function exportBackup(){
  if(noteDirty){ noteDirty=false; clearTimeout(noteT); }
  await flushNotesNow();
  const notes={};
  NOTES.forEach((v,k)=>{ if(v&&v.text) notes[k]={text:v.text, up:v.up||0}; });
  const pack={
    kind:'ebooklib_library_backup',
    schema:3,
    exported_at:new Date().toISOString(),
    app:{ generated_at:DB.generated_at||'', books:BOOKS.length, scansets:SCANS.length },
    state:Object.assign({},state,{note:{}}),
    notes,
  };
  dl(`书库备份_${dateStamp()}_v3.json`,JSON.stringify(pack,null,1),'application/json');
  const kb=(JSON.stringify(pack).length/1024).toFixed(0);
  toast(`已备份：${Object.keys(notes).length} 条笔记 · ${Object.keys(pack.state.rating).length} 个评分 · 约 ${kb}KB`);
}
async function importBackup(file){
  if(!file) return;
  if(file.size>25*1024*1024){ toast('文件过大，疑似不是备份文件'); return; }
  let data=null;
  try{ data=JSON.parse(await file.text()); }
  catch(e){ toast('不是合法的 JSON 备份'); return; }

  const st = (data && data.state) ? data.state : data;      // 兼容裸 v2 状态
  if(!st || typeof st!=='object'){ toast('备份里没有状态数据'); return; }

  // 笔记：v3 包用 data.notes；裸 v2 用 st.note
  let incNotes={};
  if(data && data.notes && typeof data.notes==='object') incNotes=data.notes;
  else Object.entries(st.note||{}).forEach(([sk,t])=>{ if(typeof t==='string'&&t.trim()) incNotes[sk]={text:t,up:0}; });

  const nNote=Object.keys(incNotes).length;
  const mode = confirm(
    `准备导入：${nNote} 条笔记 · ${Object.keys(st.rating||{}).length} 个我的评分 · ${Object.keys(st.page||{}).length} 条进度。\n\n`
    +`点「确定」= 合并（保留本机独有，冲突按备份为准）\n点「取消」= 放弃导入`);
  if(!mode){ toast('已取消'); return; }

  let addNote=0, addRate=0, addPage=0, addLink=0, badLink=0, unknown=0;
  Object.entries(incNotes).forEach(([sk,v])=>{
    const t=(v&&typeof v==='object')?String(v.text||''):String(v||'');
    if(!t.trim()) return;
    if(!BY_SK.has(sk)) unknown++;
    const cur=NOTES.get(sk);
    if(!cur || (v.up||0)>=(cur.up||0)){ NOTES.set(sk,{text:t,up:(v&&v.up)||Date.now()}); addNote++; }
  });
  Object.entries(st.rating||{}).forEach(([sk,v])=>{
    const n=Math.round(Number(v));
    if(n>=1&&n<=5){ state.rating[sk]=n; addRate++; }
  });
  Object.entries(st.page||{}).forEach(([sk,v])=>{
    if(!v||typeof v!=='object') return;
    const r=toInt(v.read,0,1000000), t=toInt(v.total,1,1000000);
    const o={}; if(r)o.read=r; if(t)o.total=t;
    if(o.read||o.total){ state.page[sk]=o; addPage++; }
  });
  Object.entries(st.link||{}).forEach(([sk,v])=>{
    const u=safeUrl(v);
    if(u){ state.link[sk]=u; addLink++; } else if(v) badLink++;
  });
  ['read','tag','fmt','cat','hidden'].forEach(k=>{
    Object.entries(st[k]||{}).forEach(([sk,v])=>{ state[k][sk]=v; });
  });

  rebuildNoteIndex();
  await flushNotesNow();
  state.__v=3; saveNow();
  renderCats(); render();
  toast(`导入完成：笔记 ${addNote} · 评分 ${addRate} · 进度 ${addPage} · 链接 ${addLink}`
        + (badLink?` · 丢弃非法链接 ${badLink}`:'') + (unknown?` · ${unknown} 条属其他版本书库`:''));
  updateStoreBadge();
}

/* ---------- 数据体检 ----------
   个人数据只存在「当前浏览器 + 当前地址」的 localStorage / IndexedDB 里。
   内置预览面板每次可能换端口，换端口 = 换 origin = 看不到彼此的评分。 */
const ST_FIELDS=['rating','page','read','tag','fmt','cat','hidden','autoHidden','link','noteIndex','note'];
const IS_FIXED=(location.protocol==='https:') ||
               ((location.protocol==='http:') && location.port==='5175');
function fixedUrl(){
  // 当前打开的这个页面就是应该收藏的固定入口；不写死任何本机文件名
  return location.href.split('#')[0].split('?')[0];
}
function updateStoreBadge(){
  const el=document.getElementById('storeBadge'); if(!el) return;
  const n=Object.keys(state.rating||{}).length;
  const where=IS_FIXED?(location.protocol==='https:'?'固定站点':'固定入口')
    :(location.protocol==='file:'?'本地文件':'端口 '+(location.port||'—'));
  el.textContent=`本机评分 ${n} · ${where}`;
  el.className='storebadge'+(IS_FIXED?'':' warn');
  el.title=IS_FIXED?'数据存在当前浏览器的这个地址下，点开可查看详情'
    :'⚠ 当前地址不是固定入口，换地址或换浏览器看不到彼此的评分与进度。点开查看';
}
function healthStats(){
  const out={}; let orphan=0; const seen=new Set();
  ST_FIELDS.forEach(k=>{
    const m=state[k]||{}; out[k]=Object.keys(m).length;
    if(k==='rating'||k==='page'||k==='read'){
      Object.keys(m).forEach(sk=>{ if(!BY_SK.has(sk)) seen.add(sk); });
    }
  });
  orphan=seen.size;
  return {out,orphan};
}
function decodeRecover(code){
  try{
    const b=atob(String(code).trim().replace(/-/g,'+').replace(/_/g,'/').replace(/\s/g,''));
    const bytes=Uint8Array.from(b,c=>c.charCodeAt(0));
    return JSON.parse(new TextDecoder().decode(bytes));
  }catch(e){ return null; }
}
function applyRecover(code){
  const d=decodeRecover(code);
  if(!d||!d.state||typeof d.state!=='object') return -1;
  let n=0;
  ST_FIELDS.forEach(k=>{
    const src=d.state[k]; if(!src||typeof src!=='object') return;
    Object.entries(src).forEach(([sk,v])=>{
      if(!Object.prototype.hasOwnProperty.call(state[k],sk)){ state[k][sk]=v; n++; }
    });
  });
  if(d.notes&&typeof d.notes==='object'){
    Object.entries(d.notes).forEach(([sk,v])=>{
      if(!NOTES.has(sk)&&v&&v.text){ NOTES.set(sk,{text:v.text,up:v.up||Date.now()}); n++; }
    });
    if(n) rebuildNoteIndex();
    flushNotesNow();
  }
  if(n){ state.__v=3; saveNow(); renderCats(); render(); updateStoreBadge(); }
  return n;
}
function openHealth(){
  const {out,orphan}=healthStats();
  const here=location.href.split('#')[0];
  const f=fixedUrl();
  document.getElementById('hBody').innerHTML=`
    <h5>当前数据存放位置</h5>
    <div>地址：<code>${esc(here)}</code></div>
    <div class="note" style="margin-top:9px">${IS_FIXED
      ? '这是固定入口。评分、进度、笔记只存在<b>当前浏览器</b>的这一步地址下；换浏览器或换端口看不到。'
      : '<b>⚠ 当前不是固定入口。</b>你的评分和进度只属于这个地址，换端口（内置预览每次可能不同）、换浏览器、或双击本地 HTML，都会看到另一套空数据。'}</div>
    <h5>本机已保存的个人信息</h5>
    <div class="kv">
      <span>我的评分 <b>${out.rating}</b></span><span>阅读进度 <b>${out.page}</b></span>
      <span>已读标记 <b>${out.read}</b></span><span>笔记 <b>${NOTES.size}</b></span>
      <span>标签 <b>${out.tag}</b></span><span>分类覆写 <b>${out.cat}</b></span>
      <span>手工隐藏 <b>${out.hidden}</b></span><span>笔记链接 <b>${out.link}</b></span>
    </div>
    <div style="color:${orphan?'var(--warn)':'var(--txt3)'};font-size:12px;margin-top:6px">
      ${orphan?`有 ${orphan} 条个人数据的书已经不在当前清单里（可能已删除或移动），数据仍保留，没有丢弃。`:'所有个人数据都能对上当前书卡。'}</div>
    <h5>固定入口（建议在 Chrome / Edge 收藏）</h5>
    <div><code>${esc(f)}</code></div>
    <div class="row">
      <button class="btn" id="hCopyUrl">复制地址</button>
      <button class="btn" id="hOpenUrl">在新标签打开</button>
    </div>
    <h5>跨地址恢复（把别处的评分搬到这里）</h5>
    <div style="font-size:12px;color:var(--txt3)">粘贴恢复码，或点「恢复」选择备份 JSON。只会补上这里缺少的条目，不覆盖你已有的数据。</div>
    <textarea id="hCode" placeholder="粘贴恢复码…"></textarea>
    <div class="row">
      <button class="btn" id="hApply">应用恢复码</button>
      <button class="btn" id="hImport">恢复（选备份文件）</button>
      <button class="btn" id="hExport">备份（导出 JSON）</button>
    </div>`;
  document.getElementById('hScrim').classList.add('show');
  document.getElementById('hModal').classList.add('show');
  lockBody();
  document.getElementById('hCopyUrl').onclick=()=>copyText(f);
  document.getElementById('hOpenUrl').onclick=()=>window.open(f,'_blank','noopener');
  document.getElementById('hImport').onclick=()=>document.getElementById('impFile').click();
  document.getElementById('hExport').onclick=exportBackup;
  document.getElementById('hApply').onclick=()=>{
    const n=applyRecover(document.getElementById('hCode').value);
    toast(n<0?'恢复码无效或已损坏':(n?`已补回 ${n} 条个人数据`:'恢复码里没有新数据'));
    if(n>0) openHealth();
  };
}
function closeHealth(){
  document.getElementById('hScrim').classList.remove('show');
  document.getElementById('hModal').classList.remove('show');
  unlockBody();
}
document.getElementById('btnHealth').onclick=openHealth;
document.getElementById('storeBadge').onclick=openHealth;
document.getElementById('hClose').onclick=closeHealth;
document.getElementById('hScrim').onclick=closeHealth;

document.getElementById('btnCat').onclick=()=>{
  const v=bc.value; if(!v){toast('先选一个分类');return;}
  const ids=[...sel]; if(!ids.length){toast('请先勾选书');return;}
  ids.forEach(sk=>{state.cat[sk]=v;}); save(); renderCats(); render();
  toast(`已把 ${ids.length} 本改为「${v}」`);
};

/* ---------- 启动 ---------- */
(async function(){
  // 历史存储整库搬迁：必须早于 resolveLibrary() 与 loadNotes()，否则书单回退、笔记索引被清空
  try{ await withTimeout(seedLegacyIDB(),3000); }catch(e){}
  migrate();
  initDrawer();
  // Windows 旧版把反斜杠写进 sk；统一成正斜杠后再走 rmap，评分不丢
  const legacyPairs=migrateLegacySk();
  if(legacyPairs.length){ try{ await migrateKeys(legacyPairs); }catch(e){} }
  await resolveLibrary();                       // URL > 本机已存书单 > 内嵌示例
  updateStoreBadge();
  // 先无条件渲染一次：IndexedDB 慢或被禁用（隐私模式/某些 file:// 环境）时页面不能白屏
  renderCats(); render();
  maybeShowWelcome();                           // 同步触发，不等 IDB
  const qs=new URLSearchParams(location.search);
  if(qs.get('testscan')==='1' && DS){          // 无头验收：模拟一次前端扫描
    closeWelcome(true);
    const mock=[
      {rel:'测试书库/文学/测试·山居札记 - 测试作者.epub',name:'测试·山居札记 - 测试作者.epub',ext:'.epub',size:430080,mtime:0},
      {rel:'测试书库/科幻/测试·星轨之外.azw3',name:'测试·星轨之外.azw3',ext:'.azw3',size:512000,mtime:0},
      {rel:'测试书库/历史/测试·江岸旧事.第1卷.pdf',name:'测试·江岸旧事.第1卷.pdf',ext:'.pdf',size:2400000,mtime:0},
      {rel:'测试书库/历史/测试·江岸旧事.第2卷.pdf',name:'测试·江岸旧事.第2卷.pdf',ext:'.pdf',size:2300000,mtime:0}
    ];
    await applyScanResult(DS.buildCards(mock));
  }
  try{ await withTimeout(migrateV3(), 4000); }catch(e){ console.error('笔记迁移失败',e); }
  // C：重建后 sk 变了 → 按 rmap 把本机状态搬到新键（幂等，只搬「旧键有新键没有」的）
  const rmap=DB.rmap||{};
  if(Object.keys(rmap).length){
    try{ localStorage.setItem(LS_V3+'_preRmap', JSON.stringify(state)); }catch(e){}
    await migrateKeys(Object.entries(rmap));
  }
  let d=null;
  try{ d=await withTimeout(idbGet('diff'), 3000); }catch(e){}
  if(d && d!=='__timeout__' && d.ts && d.v===3){
    SYNC=d;
    await applyMoved(d.moved||{});                        // 上次记录的搬家，重新打开页面继续生效
    setSyncState('已同步 '+new Date(d.ts).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}),'ok');
    updateSyncInfo();
  } else if(d!=='__timeout__'){
    setSyncState('需重新同步','');
  }
  // 恢复码：在当前任意地址下把别处导出的个人数据补进本机（只补空缺，不覆盖）
  try{
    const hs=location.hash||'';
    if(hs.indexOf('#recover=')===0){
      const n=applyRecover(decodeURIComponent(hs.slice(9)));
      history.replaceState(null,'',location.pathname+location.search);
      toast(n<0?'恢复码无效':(n?`已从恢复码补回 ${n} 条个人数据`:'恢复码里没有新数据'));
    }
  }catch(e){ console.warn('恢复码处理失败',e); }
  updateStoreBadge();
  renderCats(); render();                                // 迁移/同步结果到位后刷新
})();
})();
</script>
